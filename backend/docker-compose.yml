# Servicios de desarrollo: PostgreSQL + Redis (BullMQ).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: licencias
      POSTGRES_PASSWORD: licencias
      POSTGRES_DB: licencias
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea la base "licencias_test" que usan las pruebas e2e (solo la primera vez).
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licencias -d licencias"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
