# Servicios de desarrollo: PostgreSQL 16 + Redis 7.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freecell
      POSTGRES_PASSWORD: freecell
      POSTGRES_DB: freecell
    ports:
      - '5432:5432'
      # Puerto alterno: en máquinas con un PostgreSQL nativo ocupando 5432, usa este en DATABASE_URL.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea la base "licencias_test" de las pruebas e2e (solo al crear el volumen).
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freecell -d freecell']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
      # Puerto alterno: en máquinas con un Redis/Memurai nativo ocupando 6379, usa este en REDIS_URL.
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
