name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: freecell
          POSTGRES_PASSWORD: freecell
          POSTGRES_DB: freecell
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freecell -d freecell"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # Sin --fix: refleja lo que corre en cualquier máquina, no lo "arregla" en silencio en CI.
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - run: npm test

      # El contenedor de Postgres solo trae la base "freecell" (POSTGRES_DB); "licencias_test" la
      # crea docker-compose vía docker/init-test-db.sql en desarrollo local. Acá no hay ese volumen
      # de inicialización, así que se crea a mano antes de correr los e2e.
      - name: Crear base licencias_test
        run: |
          node -e "
            const { Client } = require('pg');
            const c = new Client({ host: 'localhost', port: 5432, user: 'freecell', password: 'freecell', database: 'freecell' });
            c.connect()
              .then(() => c.query('CREATE DATABASE licencias_test'))
              .then(() => c.end());
          "

      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholders solo para que `next build` tenga algo que leer (D43-style: nunca secretos
      # reales en CI). No son credenciales de ninguna cuenta.
      AUTH_SECRET: ci-placeholder-secret-not-a-real-secret
      API_URL: http://localhost:3000
      AUTH_GOOGLE_ID: ci-placeholder-google-id
      AUTH_GOOGLE_SECRET: ci-placeholder-google-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # tsc solo no genera los tipos ambientales de rutas/páginas/layouts (PageProps, LayoutProps):
      # eso lo hace next build o, sin build completo, next typegen.
      - run: npx next typegen

      - run: npx tsc --noEmit

      # continue-on-error: hay deuda de lint real y preexistente (16 errores + 2 warnings en 9
      # archivos, BUG-02 en docs/11-bugs-pendientes.md) que no se limpia como efecto secundario de
      # armar CI. Queda visible en el run pero no bloquea.
      - run: npm run lint
        continue-on-error: true

      - run: npm run test:unit

      - run: npm run build
